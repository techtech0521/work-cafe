name: CI

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository and commit history for secrets
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git /repo --redact --verbose --no-banner

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The unit-test command uses Node's built-in TypeScript stripping,
          # which is available in Node.js 22 and newer.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate cafe data
        run: npm run validate:data

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke-check production server
        run: |
          npm start > /tmp/work-cafe-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/work-cafe-next.log' EXIT
          node scripts/smoke-check.mjs http://127.0.0.1:3000

  smoke-deployment:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.ref == 'main' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Check the catalogue that was actually deployed, rather than a
          # potentially newer default-branch revision.
          ref: ${{ github.event.deployment.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke-check deployed application
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: node scripts/smoke-check.mjs "$DEPLOYMENT_URL"
