name: Update cafes

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-cafes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.ref_type == 'branch' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.8"

      - name: Update cafe data
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/update_google_places.py --fail-on-error

      - name: Commit and push updated cafe data
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- data/cafes.json; then
            echo "Cafe data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/cafes.json
          git commit -m "chore: update cafe data"

          # Rebase onto the latest remote tip so a concurrent human update is
          # never replaced by a force push. A conflict fails the workflow.
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
