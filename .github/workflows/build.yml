name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Secret scan must include every commit, not only the triggering commit.
          fetch-depth: 0

      - name: Scan repository and commit history for secrets
        # Use the OSS CLI image directly. gitleaks-action requires a paid
        # license for organization-owned repositories, which made this build
        # fail before linting or compiling the application.
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.2
        with:
          args: git /github/workspace --redact --verbose --no-banner

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
